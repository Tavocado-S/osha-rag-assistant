services:
  osha-rag-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist the vector store outside the container so you don't
      # re-embed on every rebuild
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
